<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Create New Order</title>
    <link
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
        crossorigin="anonymous"
    />
</head>
<body>
    <div class="container">
        <h3 class="my-4">Create New Order</h3>
        
        <!-- Display error message if any -->
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>
        
        <form th:action="@{/order/create}" method="post">
            <div class="form-group">
                <label for="authorName">Your Name:</label>
                <input type="text" class="form-control" id="authorName" name="authorName" required />
            </div>
            
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">Available Products</h5>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(products)}" class="alert alert-warning">
                        No products available for order.
                    </div>
                    
                    <div th:if="${not #lists.isEmpty(products)}" class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Select</th>
                                    <th>Product Name</th>
                                    <th>Available Quantity</th>
                                    <th>Order Quantity</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="product, productStat : ${products}">
                                    <td>
                                        <input type="checkbox" th:id="${'product-' + productStat.index}" 
                                               th:name="selectedProducts" th:value="${product.id}" 
                                               class="product-checkbox" />
                                    </td>
                                    <td th:text="${product.name}"></td>
                                    <td th:text="${product.quantity}"></td>
                                    <td>
                                        <input type="number" class="form-control quantity-input" 
                                               th:id="${'quantity-' + productStat.index}" 
                                               th:name="${'quantity-' + product.id}" 
                                               min="1" th:max="${product.quantity}" value="1" disabled />
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" id="submitButton" disabled>Create Order</button>
            <a th:href="@{/order}" class="btn btn-secondary">Back</a>
        </form>
    </div>

    <script>
        // Enable/disable quantity inputs based on checkbox selection
        document.addEventListener('DOMContentLoaded', function() {
            const checkboxes = document.querySelectorAll('.product-checkbox');
            const quantityInputs = document.querySelectorAll('.quantity-input');
            const submitButton = document.getElementById('submitButton');
            
            checkboxes.forEach(function(checkbox, index) {
                checkbox.addEventListener('change', function() {
                    quantityInputs[index].disabled = !this.checked;
                    
                    // Enable submit button if at least one product is selected
                    const anyChecked = Array.from(checkboxes).some(cb => cb.checked);
                    submitButton.disabled = !anyChecked;
                });
            });
        });
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"
    ></script>
</body>
</html>
