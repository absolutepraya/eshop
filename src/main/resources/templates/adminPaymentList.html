<!DOCTYPE html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
>
	<head>
		<meta charset="UTF-8" />
		<title>Admin Payment List</title>
		<link
			href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
			crossorigin="anonymous"
		/>
	</head>
	<body>
		<div class="container">
			<h3 class="my-4">Admin Payment List</h3>

			<div
				th:if="${payments.empty}"
				class="alert alert-info"
			>
				No payments found in the system.
			</div>

			<div th:unless="${payments.empty}">
				<table class="table table-striped">
					<thead>
						<tr>
							<th>Payment ID</th>
							<th>Order ID</th>
							<th>Customer</th>
							<th>Method</th>
							<th>Status</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="payment : ${payments}">
							<td th:text="${payment.id}"></td>
							<td th:text="${payment.order.id}"></td>
							<td th:text="${payment.order.author}"></td>
							<td th:text="${payment.method}"></td>
							<td>
								<span
									th:if="${payment.status == 'PENDING'}"
									class="badge bg-warning text-dark"
									>Pending</span
								>
								<span
									th:if="${payment.status == 'SUCCESS'}"
									class="badge bg-success"
									>Success</span
								>
								<span
									th:if="${payment.status == 'REJECTED'}"
									class="badge bg-danger"
									>Rejected</span
								>
							</td>
							<td>
								<a
									th:href="@{/payment/admin/detail/{id}(id=${payment.id})}"
									class="btn btn-sm btn-primary"
									>View Detail</a
								>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<a
				th:href="@{/}"
				class="btn btn-secondary"
				>Back to Home</a
			>
		</div>

		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
			crossorigin="anonymous"
		></script>
	</body>
</html>
