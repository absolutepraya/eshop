<!DOCTYPE html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
>
	<head>
		<meta charset="UTF-8" />
		<title>Pay Order</title>
		<link
			href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
			crossorigin="anonymous"
		/>
	</head>
	<body>
		<div class="container">
			<h3 class="my-4">Pay Order #<span th:text="${order.id}"></span></h3>

			<div class="card mb-4">
				<div class="card-header">Order Details</div>
				<div class="card-body">
					<p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
					<p>
						<strong>Customer:</strong> <span th:text="${order.author}"></span>
					</p>
					<p>
						<strong>Date:</strong>
						<span
							th:text="${#dates.format(new java.util.Date(order.orderTime), 'dd-MM-yyyy HH:mm')}"
						></span>
					</p>
					<p>
						<strong>Status:</strong> <span th:text="${order.status}"></span>
					</p>

					<h5 class="mt-3">Products:</h5>
					<ul>
						<li
							th:each="product : ${order.products}"
							th:text="${product.name + ' - ' + product.quantity + ' units'}"
						></li>
					</ul>
				</div>
			</div>

			<!-- Display error message if any -->
			<div th:if="${errorMessage}" class="alert alert-danger" role="alert">
				<span th:text="${errorMessage}"></span>
			</div>

			<form
				th:action="@{/order/pay/{id}(id=${order.id})}"
				method="post"
			>
				<div class="form-group">
					<label for="paymentMethodSelect">Payment Method</label>
					<select
						class="form-control mb-4 col-4"
						id="paymentMethodSelect"
						name="paymentMethod"
						required
					>
						<option value="">Select Payment Method</option>
						<option
							th:each="method : ${paymentMethods}"
							th:value="${method}"
							th:text="${method}"
						></option>
					</select>
				</div>

				<!-- Voucher Code Payment Fields -->
				<div
					id="voucherFields"
					style="display: none"
				>
					<div class="form-group">
						<label for="voucherCode">Voucher Code</label>
						<input
							type="text"
							class="form-control mb-4 col-4"
							id="voucherCode"
							name="voucherCode"
							placeholder="Enter 16-character voucher code"
							maxlength="16"
						/>
						<small class="form-text text-muted">
							Voucher code must be 16 characters long, start with "ESHOP", and contain 8 numerical characters.
							Example: ESHOP1234ABC5678
						</small>
					</div>
				</div>

				<!-- Cash on Delivery (COD) Payment Fields -->
				<div
					id="codFields"
					style="display: none"
				>
					<div class="form-group">
						<label for="address">Delivery Address</label>
						<textarea
							class="form-control mb-4 col-6"
							id="address"
							name="address"
							rows="3"
							placeholder="Enter delivery address"
						></textarea>
					</div>
					<div class="form-group">
						<label for="deliveryFee">Delivery Fee</label>
						<input
							type="text"
							class="form-control mb-4 col-4"
							id="deliveryFee"
							name="deliveryFee"
							placeholder="Enter delivery fee"
						/>
					</div>
				</div>

				<button
					type="submit"
					class="btn btn-primary"
				>
					Proceed to Pay
				</button>
			</form>

			<a
				th:href="@{/order/history}"
				class="btn btn-secondary mt-3"
				>Back to Orders</a
			>
		</div>

		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
			crossorigin="anonymous"
		></script>
		<script>
			// Show/hide payment method fields based on selection
			document
				.getElementById('paymentMethodSelect')
				.addEventListener('change', function () {
					// Hide all fields first
					document.getElementById('voucherFields').style.display = 'none';
					document.getElementById('codFields').style.display = 'none';

					// Show relevant fields based on selection
					if (this.value === 'VOUCHER') {
						document.getElementById('voucherFields').style.display = 'block';
					} else if (this.value === 'COD') {
						document.getElementById('codFields').style.display = 'block';
					}
				});
		</script>
	</body>
</html>
