<!DOCTYPE html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Car List</title>
		<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
		<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" rel="stylesheet">
		<style>
			body {
				background-color: #f8f9fa;
			}
			.hero-section {
				padding: 3rem 0;
				background-color: #4e73df;
				color: white;
				margin-bottom: 2rem;
			}
			.card {
				transition: transform 0.3s ease, box-shadow 0.3s ease;
				margin-bottom: 1.5rem;
			}
			.card:hover {
				transform: translateY(-5px);
				box-shadow: 0 10px 20px rgba(0,0,0,0.1);
			}
			.card-icon {
				font-size: 2.5rem;
				margin-bottom: 1rem;
				color: #4e73df;
			}
			.footer {
				margin-top: 2rem;
				padding: 1.5rem 0;
				background-color: #f1f1f1;
			}
			.table {
				background-color: white;
				box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
			}
			.action-buttons form {
				display: inline;
			}
		</style>
	</head>
	<body>
		<!-- Hero Section -->
		<div class="hero-section">
			<div class="container">
				<h1 class="display-4">Car Management</h1>
				<p class="lead">View, create, update, and delete cars in our inventory</p>
			</div>
		</div>

		<div class="container pb-5">
			<div class="card mb-4">
				<div class="card-body">
					<div class="d-flex justify-content-between align-items-center mb-3">
						<h3 class="card-title mb-0">Car List</h3>
						<div>
							<a th:href="@{/car/create}" class="btn btn-primary">
								<i class="fas fa-plus mr-2"></i>Create Car
							</a>
							<a th:href="@{/product/list}" class="btn btn-secondary ml-2">
								<i class="fas fa-box mr-2"></i>View Products
							</a>
						</div>
					</div>
					
					<div class="table-responsive">
						<table class="table table-striped">
							<thead class="bg-primary text-white">
								<tr>
									<th scope="col">Car Name</th>
									<th scope="col">Color</th>
									<th scope="col">Quantity</th>
									<th scope="col">Actions</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="car: ${cars}">
									<td th:text="${car.carName}"></td>
									<td th:text="${car.carColor}"></td>
									<td th:text="${car.carQuantity}"></td>
									<td class="action-buttons">
										<a th:href="@{/car/edit/{id}(id=${car.carId})}" class="btn btn-primary btn-sm">
											<i class="fas fa-edit mr-1"></i>Edit
										</a>
										<form th:action="@{/car/delete}" method="post">
											<input type="hidden" name="id" th:value="${car.carId}" />
											<button type="submit" class="btn btn-danger btn-sm">
												<i class="fas fa-trash mr-1"></i>Delete
											</button>
										</form>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
			
			<div class="text-center mt-3">
				<a th:href="@{/}" class="btn btn-secondary">
					<i class="fas fa-home mr-2"></i>Back to Home
				</a>
			</div>
		</div>

		<!-- Scripts -->
		<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"></script>
		<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>
	</body>
</html>
