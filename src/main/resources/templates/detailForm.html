<!DOCTYPE html>
<html
	lang="en"
	xmlns:th="http://www.thymeleaf.org"
>
	<head>
		<meta charset="UTF-8" />
		<title>Payment Details</title>
		<link
			href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
			crossorigin="anonymous"
		/>
	</head>
	<body>
		<div class="container">
			<h3 class="my-4">Check Payment Status</h3>
			<form
				id="paymentForm"
				onsubmit="redirectToPaymentDetail(event)"
			>
				<div class="form-group">
					<label for="paymentIdInput">Payment ID</label>
					<input
						type="text"
						class="form-control mb-4 col-4"
						id="paymentIdInput"
						name="paymentId"
						placeholder="Enter your payment ID"
						required
					/>
				</div>
				<button
					type="submit"
					class="btn btn-primary"
				>
					Check Payment
				</button>
			</form>
			<a
				th:href="@{/payment}"
				class="btn btn-secondary mt-3"
				>Back</a
			>
		</div>

		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
			crossorigin="anonymous"
		></script>

		<script>
			function redirectToPaymentDetail(event) {
				event.preventDefault();
				const paymentId = document.getElementById('paymentIdInput').value;
				if (paymentId) {
					window.location.href = '/payment/detail/' + paymentId;
				}
			}
		</script>
	</body>
</html>
